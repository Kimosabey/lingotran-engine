name: pipeline checks

# The 118 tests and the export gates existed but ran only when someone
# remembered to run them. Every defect fixed on 2026-08-10 -- HTML comments as
# catalog titles, `teil` vs `part`, "A2 (inferred)" levels, header-only CSVs --
# reached a shipped deliverable. These checks make the gates binding.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Added while eleven runs failed here and passed in a clean local checkout.
      # The difference was environmental and is now fixed at the root (.gitattributes
      # pins the line endings the writers actually emit), but the step stays: it
      # costs a second and turns the next environment-shaped red X into something
      # readable instead of another round of guessing.
      - name: Environment
        run: |
          python -VV
          python -c "import fitz, PIL; print('pymupdf', fitz.pymupdf_version); print('pillow', PIL.__version__)"
          echo "locale: ${LANG:-unset} / filesystem: $(python -c 'import sys;print(sys.getfilesystemencoding())')"
          echo "tracked export artifacts:"
          git ls-files 'french/extracted/*/*.csv' 'french/extracted/*.csv' | wc -l
          echo "page images present (expected 0 - gitignored):"
          ls french/extracted/*/images 2>/dev/null | wc -l

      - name: Engine tests
        run: python -m unittest discover -s _engine/tests -v

      - name: German pipeline tests
        run: python -m unittest discover -s german/extracted/_tools/tests -v

      # The deliverable gate: schema, taxonomy, cell hygiene, page references
      # and packaging drift, against the CSVs a recipient actually opens.
      # Non-zero exit fails the build.
      - name: Verify French exports
        run: python _engine/verify_exports.py --root french/extracted

      - name: Verify German exports
        run: python _engine/verify_exports.py --root german/extracted

      # Completeness: every page transcribed, QA'd and classified, and every
      # finished book describing itself in collections.json.
      - name: Reconcile French collections
        run: python _engine/reconcile.py --root french/extracted --all

      # German was absent from both this and the answer gate below, so ten
      # DELIVERED books were checked for export shape and nothing else. Both
      # exited 1 the first time they were pointed at German: three books
      # carried none of the four required declarations, and 11 answer items
      # were flagged. Neither condition had anything watching it.
      - name: Reconcile German collections
        run: python _engine/reconcile.py --root german/extracted --all

      # Staleness: the gates above all read the exports as they stand and would
      # pass a clean-looking but out-of-date file. This rebuilds into a scratch
      # copy and diffs, so a source edit that was never re-exported fails here
      # instead of shipping. (A German export once went out at 8.7% coverage
      # exactly this way.)
      - name: Exports current with sources
        run: python _engine/check_exports_current.py --root french/extracted

      # Answer shape/alignment and the answer-key coverage cross-check. Now
      # BINDING (--strict): it used to exit 0 while printing NEEDS REPAIR PASS,
      # so CI could not fail on it and a flagged book could be packaged.
      # Individually reviewed, legitimate flags are waived per book via
      # `accepted_answer_flags` and still print on every run.
      - name: Verify French answers
        run: python _engine/verify_answers.py --root french/extracted --all --strict

      # --dry-run is mandatory here, not caution. This tool normalizes
      # correct_answer in place, and German's books are already delivered: run
      # without it and CI would silently rewrite the corpus it is meant to be
      # guarding, one commit at a time, with the working tree of whatever
      # machine ran it. --dry-run reports what it would change and writes
      # nothing; test_verify_answers.py asserts that at byte level.
      - name: Verify German answers
        run: python _engine/verify_answers.py --root german/extracted --all --dry-run --strict
